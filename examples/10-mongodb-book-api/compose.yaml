services:
  db:
    image: mongo:7.0
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    volumes:
      - book_mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok === 1 ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
volumes:
  book_mongodata:
