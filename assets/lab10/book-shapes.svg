<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#bd7b32"/></marker></defs><rect width="1440" height="600" fill="#f6f8fb"/><text x="40" y="55" font-family="Waree, sans-serif" font-size="32" fill="#102c46" font-weight="700">หนังสือเล่มเดียวกัน แต่รูปแบบต่างกันตามชั้น</text><text x="40" y="100" font-family="Waree, sans-serif" font-size="22" fill="#102c46" font-weight="400">ใช้ตัวอย่าง Database Practice เพื่อเห็น field ที่เพิ่มขึ้นและ field ที่ส่งออก</text><rect x="35" y="160" width="390" height="290" rx="12" fill="white" stroke="#167184" stroke-width="2"/><rect x="35" y="160" width="390" height="51" rx="10" fill="#167184"/><text x="53" y="194" font-family="Waree, sans-serif" font-size="24" fill="white" font-weight="700">POST body</text><text x="53" y="248" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">title / author</text><text x="53" y="286" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">sourceType / summary</text><text x="53" y="324" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">ยังไม่มี id</text><text x="53" y="362" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">ผู้ใช้ไม่ส่ง titleKey</text><path d="M425,300 L490,300" stroke="#bd7b32" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="495" y="160" width="440" height="290" rx="12" fill="white" stroke="#167184" stroke-width="2"/><rect x="495" y="160" width="440" height="51" rx="10" fill="#167184"/><text x="513" y="194" font-family="Waree, sans-serif" font-size="24" fill="white" font-weight="700">MongoDB document</text><text x="513" y="248" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">_id: ObjectId(...)</text><text x="513" y="286" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">title / author / ...</text><text x="513" y="324" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">titleKey: database practice</text><text x="513" y="362" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">createdAt / updatedAt</text><path d="M935,300 L1000,300" stroke="#bd7b32" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1005" y="160" width="400" height="290" rx="12" fill="white" stroke="#167184" stroke-width="2"/><rect x="1005" y="160" width="400" height="51" rx="10" fill="#167184"/><text x="1023" y="194" font-family="Waree, sans-serif" font-size="24" fill="white" font-weight="700">API response</text><text x="1023" y="248" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">{ data: { id: &quot;...&quot;, ... } }</text><text x="1023" y="286" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">id เป็น string</text><text x="1023" y="324" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">ไม่ส่ง titleKey หรือ __v</text><text x="1023" y="362" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">React อ่าน response.data</text></svg>