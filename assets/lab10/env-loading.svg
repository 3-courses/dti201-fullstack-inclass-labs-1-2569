<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#bd7b32"/></marker></defs><rect width="1440" height="600" fill="#f6f8fb"/><text x="40" y="55" font-family="Waree, sans-serif" font-size="32" fill="#102c46" font-weight="700">จาก .env ผ่าน Node.js ไปเชื่อม MongoDB</text><text x="40" y="100" font-family="Waree, sans-serif" font-size="22" fill="#102c46" font-weight="400">ค่าของเครื่องอยู่ในไฟล์ตั้งค่า ส่วนคำสั่ง query อยู่ในโค้ด</text><rect x="35" y="155" width="340" height="230" rx="12" fill="white" stroke="#167184" stroke-width="2"/><rect x="35" y="155" width="340" height="51" rx="10" fill="#167184"/><text x="53" y="189" font-family="Waree, sans-serif" font-size="24" fill="white" font-weight="700">.env ที่ backend</text><text x="53" y="243" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">MONGODB_URI=...</text><text x="53" y="281" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">PORT=3001</text><text x="53" y="319" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">ไม่เก็บรหัสจริงใน Git</text><path d="M375,265 L440,265" stroke="#bd7b32" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="445" y="155" width="480" height="230" rx="12" fill="white" stroke="#167184" stroke-width="2"/><rect x="445" y="155" width="480" height="51" rx="10" fill="#167184"/><text x="463" y="189" font-family="Waree, sans-serif" font-size="24" fill="white" font-weight="700">node --env-file=.env</text><text x="463" y="243" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">อ่านไฟล์ก่อนเริ่ม JavaScript</text><text x="463" y="281" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">process.env.MONGODB_URI</text><text x="463" y="319" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">process.env.PORT</text><path d="M925,265 L990,265" stroke="#bd7b32" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="995" y="155" width="410" height="230" rx="12" fill="white" stroke="#167184" stroke-width="2"/><rect x="995" y="155" width="410" height="51" rx="10" fill="#167184"/><text x="1013" y="189" font-family="Waree, sans-serif" font-size="24" fill="white" font-weight="700">src/db.js เชื่อม MongoDB</text><text x="1013" y="243" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">mongoose.connect(uri)</text><text x="1013" y="281" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">ใช้ URI ติดต่อฐานข้อมูล</text><text x="1013" y="319" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">Book model อ่าน/เขียนข้อมูล</text><text x="45" y="475" font-family="Waree, sans-serif" font-size="24" fill="#102c46" font-weight="400">.env.example แสดงชื่อค่าที่ต้องตั้ง; คำสั่งในแลบอ่านค่าจริงจาก .env</text></svg>