<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#bd7b32"/></marker></defs><rect width="1440" height="600" fill="#f6f8fb"/><text x="40" y="55" font-family="Waree, sans-serif" font-size="32" fill="#102c46" font-weight="700">ใครทำหน้าที่อะไร เมื่อเปิดรายการหนังสือ</text><text x="40" y="100" font-family="Waree, sans-serif" font-size="22" fill="#102c46" font-weight="400">อ่านซ้ายไปขวาตอนส่งคำขอ แล้วอ่านขวาไปซ้ายตอนรับข้อมูล</text><rect x="35" y="160" width="240" height="235" rx="12" fill="white" stroke="#167184" stroke-width="2"/><rect x="35" y="160" width="240" height="51" rx="10" fill="#167184"/><text x="53" y="194" font-family="Waree, sans-serif" font-size="24" fill="white" font-weight="700">React</text><text x="53" y="248" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">แสดงผล / รับ input</text><text x="53" y="286" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">fetch /api/books</text><text x="53" y="324" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">state / render</text><path d="M275,270 L320,270" stroke="#bd7b32" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="325" y="160" width="240" height="235" rx="12" fill="white" stroke="#167184" stroke-width="2"/><rect x="325" y="160" width="240" height="51" rx="10" fill="#167184"/><text x="343" y="194" font-family="Waree, sans-serif" font-size="24" fill="white" font-weight="700">Express route</text><text x="343" y="248" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">ตรวจ query / body</text><text x="343" y="286" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">เลือก HTTP status</text><text x="343" y="324" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">await store.list</text><path d="M565,270 L610,270" stroke="#bd7b32" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="615" y="160" width="240" height="235" rx="12" fill="white" stroke="#167184" stroke-width="2"/><rect x="615" y="160" width="240" height="51" rx="10" fill="#167184"/><text x="633" y="194" font-family="Waree, sans-serif" font-size="24" fill="white" font-weight="700">store + model</text><text x="633" y="248" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">Book.find()</text><text x="633" y="286" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">await ผล query</text><text x="633" y="324" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">document → API</text><path d="M855,270 L900,270" stroke="#bd7b32" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="905" y="160" width="490" height="235" rx="12" fill="white" stroke="#167184" stroke-width="2"/><rect x="905" y="160" width="490" height="51" rx="10" fill="#167184"/><text x="923" y="194" font-family="Waree, sans-serif" font-size="24" fill="white" font-weight="700">MongoDB Atlas</text><text x="923" y="248" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">course_books.books</text><text x="923" y="286" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">อ่าน document ที่เก็บไว้</text><text x="923" y="324" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">คืนผลกลับผ่าน connection</text><text x="50" y="485" font-family="Waree, sans-serif" font-size="24" fill="#102c46" font-weight="400">Browser รู้เพียง URL ของ API; MONGODB_URI อยู่ใน .env ของ backend เท่านั้น</text></svg>