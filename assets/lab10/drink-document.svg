<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#bd7b32"/></marker></defs><rect width="1440" height="600" fill="#f6f8fb"/><text x="40" y="55" font-family="Waree, sans-serif" font-size="32" fill="#102c46" font-weight="700">อ่าน document เครื่องดื่มหนึ่งรายการ</text><text x="40" y="100" font-family="Waree, sans-serif" font-size="22" fill="#102c46" font-weight="400">หนึ่ง document คือข้อมูลเครื่องดื่มหนึ่งชนิด ไม่ใช่หนึ่งแก้วที่ขาย</text><rect x="45" y="150" width="620" height="280" rx="12" fill="white" stroke="#167184" stroke-width="2"/><rect x="45" y="150" width="620" height="51" rx="10" fill="#167184"/><text x="63" y="184" font-family="Waree, sans-serif" font-size="24" fill="white" font-weight="700">drinks: Iced Cocoa</text><text x="63" y="238" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">_id: ObjectId(...00d1)</text><text x="63" y="276" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">name: &quot;Iced Cocoa&quot;</text><text x="63" y="314" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">priceSatang: 4500</text><text x="63" y="352" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">available: true</text><path d="M665,290 L765,290" stroke="#bd7b32" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="785" y="150" width="605" height="280" rx="12" fill="white" stroke="#167184" stroke-width="2"/><rect x="785" y="150" width="605" height="51" rx="10" fill="#167184"/><text x="803" y="184" font-family="Waree, sans-serif" font-size="24" fill="white" font-weight="700">field → ความหมาย</text><text x="803" y="238" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">_id → รหัสระบุรายการ</text><text x="803" y="276" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">name → ข้อความ (String)</text><text x="803" y="314" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">priceSatang → 4,500 สตางค์ = 45 บาท</text><text x="803" y="352" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">available → ค่าจริง/เท็จ (Boolean)</text><text x="55" y="505" font-family="Waree, sans-serif" font-size="23" fill="#102c46" font-weight="400">ObjectId เป็นชนิดข้อมูลของ MongoDB; เมื่อส่ง JSON ให้ React เราแปลงเป็น id แบบ string</text></svg>