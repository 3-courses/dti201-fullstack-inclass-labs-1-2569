g: 1600</text><text x="528" y="319" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">2 × 1600 = 3200 สตางค์</text><text x="528" y="357" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">ยอดเดิม = 32 บาท</text><rect x="980" y="155" width="420" height="240" rx="12" fill="white" stroke="#167184" stroke-width="2"/><rect x="980" y="155" width="420" height="51" rx="10" fill="#167184"/><text x="998" y="189" font-family="Waree, sans-serif" font-size="24" fill="white" font-weight="700">carts: สิ่งที่ยังเลือกอยู่</text><text x="998" y="243" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">Database Basics จำนวน 1</text><text x="998" y="281" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">ยังไม่มีคำสั่งซื้อใหม่</text><text x="998" y="319" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">อ่านราคาปัจจุบันจาก books</text><text x="998" y="357" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">ล้างตะกร้าไม่ลบ orders</text><text x="45" y="475" font-family="Waree, sans-serif" font-size="24" fill="#102c46" font-weight="400">เก็บราคาตอนซื้อไว้ใน order item เพื่อไม่ให้ประวัติเปลี่ยนตามราคาปัจจุบัน</text></svg>