<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#bd7b32"/></marker></defs><rect width="1440" height="600" fill="#f6f8fb"/><text x="40" y="55" font-family="Waree, sans-serif" font-size="32" fill="#102c46" font-weight="700">Cluster0 ไม่ใช่ชื่อ database</text><text x="40" y="100" font-family="Waree, sans-serif" font-size="22" fill="#102c46" font-weight="400">หนึ่ง cluster มีได้หลาย database — คู่มือนี้แยกข้อมูลสาธิตจากแอปหลัก</text><rect x="45" y="155" width="340" height="180" rx="12" fill="white" stroke="#167184" stroke-width="2"/><rect x="45" y="155" width="340" height="51" rx="10" fill="#167184"/><text x="63" y="189" font-family="Waree, sans-serif" font-size="24" fill="white" font-weight="700">Cluster0</text><text x="63" y="243" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">hostname ของแต่ละคนต่างกัน</text><text x="63" y="281" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">บริการ MongoDB บน Atlas</text><path d="M385,245 L500,245" stroke="#bd7b32" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="505" y="145" width="385" height="215" rx="12" fill="white" stroke="#167184" stroke-width="2"/><rect x="505" y="145" width="385" height="51" rx="10" fill="#167184"/><text x="523" y="179" font-family="Waree, sans-serif" font-size="24" fill="white" font-weight="700">course_books_demo</text><text x="523" y="233" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">drinks / customers / books</text><text x="523" y="271" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">categories / authors</text><text x="523" y="309" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">carts / orders</text><path d="M385,335 L500,435" stroke="#bd7b32" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="505" y="395" width="385" height="150" rx="12" fill="white" stroke="#167184" stroke-width="2"/><rect x="505" y="395" width="385" height="51" rx="10" fill="#167184"/><text x="523" y="429" font-family="Waree, sans-serif" font-size="24" fill="white" font-weight="700">course_books</text><text x="523" y="483" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">books: metadata 200 เล่ม</text><rect x="970" y="180" width="420" height="270" rx="12" fill="white" stroke="#167184" stroke-width="2"/><rect x="970" y="180" width="420" height="51" rx="10" fill="#167184"/><text x="988" y="214" font-family="Waree, sans-serif" font-size="24" fill="white" font-weight="700">สิ่งที่เห็นใน Data Explorer</text><text x="988" y="268" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">database = กลุ่มข้อมูลของแอป</text><text x="988" y="306" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">collection = กลุ่ม document</text><text x="988" y="344" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">document = ข้อมูลหนึ่งรายการ</text><text x="988" y="382" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">field = ชื่อค่าภายใน document</text></svg>