<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#bd7b32"/></marker></defs><rect width="1440" height="600" fill="#f6f8fb"/><text x="40" y="55" font-family="Waree, sans-serif" font-size="32" fill="#102c46" font-weight="700">สร้างและบันทึกงานใน GitHub repository ของเรา</text><text x="40" y="100" font-family="Waree, sans-serif" font-size="22" fill="#102c46" font-weight="400">แต่ละช่วงสร้างไฟล์ที่ต้องใช้ ตรวจผล แล้วส่งประวัติงานกลับไปยัง repo ของตน</text><rect x="35" y="165" width="310" height="240" rx="12" fill="white" stroke="#167184" stroke-width="2"/><rect x="35" y="165" width="310" height="51" rx="10" fill="#167184"/><text x="53" y="199" font-family="Waree, sans-serif" font-size="24" fill="white" font-weight="700">1. Repo ของเรา</text><text x="53" y="253" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">GitHub: New repository</text><text x="53" y="291" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">clone URL บัญชีเรา</text><text x="53" y="329" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">origin ชี้ repo ของเรา</text><path d="M345,280 L390,280" stroke="#bd7b32" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="395" y="165" width="310" height="240" rx="12" fill="white" stroke="#167184" stroke-width="2"/><rect x="395" y="165" width="310" height="51" rx="10" fill="#167184"/><text x="413" y="199" font-family="Waree, sans-serif" font-size="24" fill="white" font-weight="700">2. สร้างไฟล์</text><text x="413" y="253" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">VS Code: New File</text><text x="413" y="291" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">คัดลอกเนื้อหาตามลิงก์</text><text x="413" y="329" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">รันคำสั่งและตรวจผล</text><path d="M705,280 L750,280" stroke="#bd7b32" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="755" y="165" width="310" height="240" rx="12" fill="white" stroke="#167184" stroke-width="2"/><rect x="755" y="165" width="310" height="51" rx="10" fill="#167184"/><text x="773" y="199" font-family="Waree, sans-serif" font-size="24" fill="white" font-weight="700">3. บันทึกบนเครื่อง</text><text x="773" y="253" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">git status / git diff</text><text x="773" y="291" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">git add ชื่อไฟล์</text><text x="773" y="329" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">git commit -m &quot;...&quot;</text><path d="M1065,280 L1110,280" stroke="#bd7b32" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1115" y="165" width="290" height="240" rx="12" fill="white" stroke="#167184" stroke-width="2"/><rect x="1115" y="165" width="290" height="51" rx="10" fill="#167184"/><text x="1133" y="199" font-family="Waree, sans-serif" font-size="24" fill="white" font-weight="700">4. ส่งขึ้น GitHub</text><text x="1133" y="253" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">git push</text><text x="1133" y="291" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">refresh repo ของเรา</text><text x="1133" y="329" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">ดูไฟล์และ commit ใหม่</text></svg>