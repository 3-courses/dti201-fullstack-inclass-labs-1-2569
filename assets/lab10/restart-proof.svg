<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#bd7b32"/></marker></defs><rect width="1440" height="600" fill="#f6f8fb"/><text x="40" y="55" font-family="Waree, sans-serif" font-size="32" fill="#102c46" font-weight="700">พิสูจน์ว่าข้อมูลอยู่ใน DB ไม่ใช่อยู่แค่ state</text><text x="40" y="100" font-family="Waree, sans-serif" font-size="22" fill="#102c46" font-weight="400">ติดตาม id เดียวกันตลอดทั้งสี่ขั้นตอน</text><rect x="35" y="170" width="295" height="230" rx="12" fill="white" stroke="#167184" stroke-width="2"/><rect x="35" y="170" width="295" height="51" rx="10" fill="#167184"/><text x="53" y="204" font-family="Waree, sans-serif" font-size="24" fill="white" font-weight="700">1. POST</text><text x="53" y="258" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">เพิ่มหนังสือทดลอง</text><text x="53" y="296" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">ได้ 201 + Location</text><text x="53" y="334" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">จด id จาก response</text><path d="M330,280 L390,280" stroke="#bd7b32" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="395" y="170" width="295" height="230" rx="12" fill="white" stroke="#167184" stroke-width="2"/><rect x="395" y="170" width="295" height="51" rx="10" fill="#167184"/><text x="413" y="204" font-family="Waree, sans-serif" font-size="24" fill="white" font-weight="700">2. ตรวจ Atlas</text><text x="413" y="258" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">ค้นหา title เดียวกัน</text><text x="413" y="296" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">เห็น _id ของ document</text><text x="413" y="334" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">เก็บใน course_books</text><path d="M690,280 L750,280" stroke="#bd7b32" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="755" y="170" width="295" height="230" rx="12" fill="white" stroke="#167184" stroke-width="2"/><rect x="755" y="170" width="295" height="51" rx="10" fill="#167184"/><text x="773" y="204" font-family="Waree, sans-serif" font-size="24" fill="white" font-weight="700">3. Restart Express</text><text x="773" y="258" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">Ctrl+C ที่ server</text><text x="773" y="296" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">npm run dev ใหม่</text><text x="773" y="334" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">ไม่ลบ database</text><path d="M1050,280 L1110,280" stroke="#bd7b32" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1115" y="170" width="290" height="230" rx="12" fill="white" stroke="#167184" stroke-width="2"/><rect x="1115" y="170" width="290" height="51" rx="10" fill="#167184"/><text x="1133" y="204" font-family="Waree, sans-serif" font-size="24" fill="white" font-weight="700">4. GET id เดิม</text><text x="1133" y="258" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">ตอบ 200</text><text x="1133" y="296" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">ชื่อและ id ตรงเดิม</text><text x="1133" y="334" font-family="Waree, sans-serif" font-size="21" fill="#102c46" font-weight="400">โหลด React ใหม่ด้วย</text></svg>